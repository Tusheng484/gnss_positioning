# 从仓库根目录运行，显式指定 --config=config/params.yaml。
# 复制为 params.yaml 后修改路径和参考坐标；本机配置不提交到 Git。
io:
  input_mode: file
  input_path: data/NovatelOEM20211114-01.log
  net_ip: 127.0.0.1
  net_port: 7003
  output_dir: output/file

output:
  terminal_output: true
  file_output: true
  file_spp_solution: true
  file_sat_states: true
  file_ephemeris: true
  file_observations: true

runtime:
  enable_spp: true
  enable_sat_state: true
  systems:
    gps: true
    bds: true

spp:
  frequency_mode: DUAL_FREQ_IF
  enable_tropo: true
  enable_tgd: true
  enable_klobuchar_model: false
  elev_mask_deg: 10.0
  snr_mask_dbhz: 30.0
  gps_klobuchar:
    enabled: false
    alpha: [0.0, 0.0, 0.0, 0.0]
    beta: [0.0, 0.0, 0.0, 0.0]
  bds_klobuchar:
    enabled: false
    alpha: [0.0, 0.0, 0.0, 0.0]
    beta: [0.0, 0.0, 0.0, 0.0]

# 替换为测站已知 ECEF 坐标（米）。全零时以首个成功解为参考，
# 此时 ENU 为相对位移，不能用作绝对定位误差。
reference_ecef:
  x: 0.0
  y: 0.0
  z: 0.0
